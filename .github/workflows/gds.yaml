name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    env:
      # Used by active-log-monitor as a signal of when 'Build GDS' is done:
      ALM_DONE: .alm-${{ github.run_id }}-${{ github.run_attempt }}.done

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # This step runs in the background to monitor and generate periodic summaries
      # of the flow.log file that is gets high-level updates during the LibreLane
      # flow in the 'Build GDS' step.
      - name: LibreLane overview
        id: librelane_overview
        uses: algofoogle/action-log-monitor@v0p2
        background: true
        continue-on-error: true
        with:
          config-file: '@alm/templates/tiny-tapeout-overview.yml'
          stop-file: ${{ env.ALM_DONE }}

      # Similar to 'Librelane overview' above, this tries to track all the
      # different subprocess log files from the LibreLane flow and give a
      # live summary of them, in hopefully a way that is much more condensed
      # than the full 'Build GDS' job's log output:
      - name: LibreLane detailed tool progress
        id: librelane_tools
        uses: algofoogle/action-log-monitor@v0p2
        background: true
        continue-on-error: true
        with:
          config-file: '@alm/templates/tiny-tapeout-tools.yml'
          stop-file: ${{ env.ALM_DONE }}

      # This is the main TT/LibreLane hardening step that synthesises the
      # RTL and generates the final GDS:
      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      # Signals active-log-monitor background steps that they can stop now:
      - name: Signal end of hardening
        if: ${{ !cancelled() }}
        run: touch -- "$ALM_DONE"

      # Waits for active-log-monitor background steps to get their final updates and exit:
      - name: Wait for final log snapshots
        wait: [librelane_overview, librelane_tools]

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
