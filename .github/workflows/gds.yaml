name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # This step runs in the background to monitor and generate periodic summaries
      # of the flow.log file that is progressively (and excessively!) emitted by
      # the LibreLane flow in the 'Build GDS' step.
      - name: LibreLane flow.log live progress summary
        id: librelane_log_monitor
        uses: algofoogle/action-log-monitor
        background: true
        continue-on-error: true
        with:
          log-finder: |
            if [[ -d runs ]]; then
              find runs -type f -name flow.log -print -quit
            fi

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      - name: Stop LibreLane log monitor
        cancel: librelane_log_monitor

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
